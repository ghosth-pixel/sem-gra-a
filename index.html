<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tigelinha — Painel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span>🥣</span><div><strong>TIGELINHA</strong><small>Painel de vendas</small></div></div>
    <nav>
      <button class="nav active" data-view="dashboard">📊 Dashboard</button>
      <button class="nav" data-view="new">➕ Nova venda</button>
      <button class="nav" data-view="sales">🧾 Vendas</button>
      <button class="nav" data-view="clients">👥 Clientes</button>
      <button class="nav" data-view="products">📦 Produtos</button>
    </nav>
    <div class="side-foot">v1.0 • Tigelinha</div>
  </aside>

  <main>
    <header class="topbar">
      <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Visão geral das suas vendas.</p></div>
      <button class="primary" id="quickNew">+ Nova venda</button>
    </header>

    <section id="dashboard" class="view active-view">
      <div class="cards">
        <div class="card"><span>💰 Faturamento</span><strong id="statRevenue">R$ 0,00</strong></div>
        <div class="card"><span>📦 Vendas</span><strong id="statSales">0</strong></div>
        <div class="card"><span>👤 Contas</span><strong id="statAccounts">0</strong></div>
        <div class="card"><span>🔑 Keys</span><strong id="statKeys">0</strong></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Vendas recentes</h2><button class="ghost" id="goSales">Ver todas</button></div>
        <div id="recentSales" class="table-wrap"></div>
      </div>
    </section>

    <section id="new" class="view">
      <div class="panel form-panel">
        <div class="type-tabs">
          <button class="type active" data-type="account">👤 Conta</button>
          <button class="type" data-type="key">🔑 Key</button>
        </div>

        <form id="saleForm">
          <div class="grid">
            <label>Produto
              <select id="product" required></select>
            </label>
            <label>Cliente / Discord
              <input id="client" placeholder="@cliente ou nome" required>
            </label>
            <label>Valor (R$)
              <input id="price" type="number" min="0" step="0.01" placeholder="0,00" required>
            </label>
            <label>Status
              <select id="status"><option>Entregue</option><option>Pendente</option></select>
            </label>
          </div>

          <div id="accountFields">
            <div class="grid">
              <label>Nick / Usuário
                <input id="username" placeholder="Nick da conta">
              </label>
              <label>Senha
                <input id="password" type="password" placeholder="Senha da conta">
              </label>
              <label>Email (opcional)
                <input id="email" placeholder="email@exemplo.com">
              </label>
            </div>
          </div>

          <div id="keyFields" class="hidden">
            <div class="grid">
              <label>Key
                <input id="key" placeholder="XXXX-XXXX-XXXX">
              </label>
              <label>Validade
                <input id="validity" placeholder="30 dias">
              </label>
            </div>
          </div>

          <label>Observação
            <textarea id="note" rows="3" placeholder="Observações internas ou para o cliente"></textarea>
          </label>

          <div class="actions">
            <button class="primary" type="submit">Gerar entrega</button>
            <button class="ghost" type="button" id="clearForm">Limpar</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Mensagem gerada</h2><button class="ghost" id="copyMsg">📋 Copiar</button></div>
        <pre id="messagePreview">Preencha a venda e clique em “Gerar entrega”.</pre>
      </div>
    </section>

    <section id="sales" class="view">
      <div class="panel">
        <div class="toolbar"><input id="searchSales" placeholder="🔎 Buscar cliente, produto ou tipo..."></div>
        <div id="allSales" class="table-wrap"></div>
      </div>
    </section>

    <section id="clients" class="view">
      <div class="panel"><div id="clientsList" class="table-wrap"></div></div>
    </section>

    <section id="products" class="view">
      <div class="panel"><div id="productsList" class="product-grid"></div></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
